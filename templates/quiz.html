{% extends "base.html" %}
{% block title %}Quiz{% endblock %}
{% block content %}
  <h2>{{ quiz.pergunta }}</h2>
  <form method="POST">
    {% for alternativa in quiz.alternativas.split(",") %}
      <input type="radio" name="resposta" value="{{ alternativa }}" required> {{ alternativa }}<br>
    {% endfor %}
    <br>
    <button type="submit">Responder</button>
  </form>
{% endblock %}
