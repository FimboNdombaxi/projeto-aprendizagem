<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Plataforma de Aprendizagem</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-left">
            <img src="{{ url_for('static', filename='imagens/logo.png') }}" 
                 alt="Logo Plataforma" height="40">
        </div>
        <div class="navbar-right">
            <a href="{{ url_for('home') }}">Início</a>
            <a href="{{ url_for('register') }}">Registrar</a>
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
        </div>
    </nav>

    <!-- Conteúdo dinâmico -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
