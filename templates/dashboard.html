{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
  <h2>Ranking de Usuários</h2>
  <table border="1">
    <tr>
      <th>Nome</th>
      <th>Pontos</th>
    </tr>
    {% for user in users %}
    <tr>
      <td>{{ user.nome }}</td>
      <td>{{ user.pontos }}</td>
    </tr>
    {% endfor %}
  </table>
{% endblock %}
